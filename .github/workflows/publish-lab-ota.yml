# Non-drivable ScooterOS development firmware only.
# Upload exactly ONE normal firmware file; manifest generation is automatic.
# Bridge 0.1.4 is compatible with earlier 0.1.3 devices that hard-code LAB URL.
# New 0.1.4 firmware itself exclusively downloads the normal BIN path.
name: ScooterOS OTA - publish standard BIN

on:
  push:
    branches: [main]
    paths:
      - 'ESP32-S3-WROOM-1/ESP32S3_N16R8/ScooterOS_ESP32S3_N16R8.bin'
      - '.github/workflows/publish-lab-ota.yml'
      - 'tools/publish_lab_ota.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scooteros-ota-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current image
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validate real BIN and create OTA manifest
        run: python3 tools/publish_lab_ota.py

      - name: Commit generated OTA manifest and transitional alias when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage new/old manifest and alias, including eventual legacy deletions.
          git add -A -- ota/ ESP32-S3-WROOM-1/ESP32S3_N16R8/
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Auto-publish ScooterOS OTA manifest"
          git push origin HEAD:main
